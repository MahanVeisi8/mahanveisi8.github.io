name: Update GitHub stats

# Refreshes _data/github_stats.json so /projects/ can render repo cards and
# language stats natively, instead of hotlinking the public
# github-readme-stats instance (which is rate-limited and often down).

on:
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "_data/github_repos.yml"
      - "scripts/fetch_github_stats.py"
      - ".github/workflows/update-github-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Fetch stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_stats.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain _data/github_stats.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/github_stats.json
            git commit -m "chore: refresh GitHub stats [skip ci]"
            git push
          else
            echo "No changes."
          fi
